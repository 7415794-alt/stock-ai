# 평일 아침(어젯밤 미국 증시가 끝난 뒤) 코스피·코스닥이 오늘 오를 확률을 계산해 'idx' 브랜치에 저장합니다.
name: 지수 확률

on:
  schedule:
    - cron: "50 21 * * 0-4"   # 21:50 UTC = 한국시간 월~금 오전 6시 50분
    - cron: "20 23 * * 0-4"   # 한국시간 오전 8시 20분 (앞 실행이 늦거나 실패했을 때 한 번 더)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/index.yml", ".github/trigger/index.txt"]

permissions:
  contents: write

concurrency:
  group: idx
  cancel-in-progress: true

jobs:
  idx:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4   # 계산 코드는 비공개 저장소(stock-ai-code)에서 읽어 옴
        with:
          repository: 7415794-alt/stock-ai-code
          token: ${{ secrets.CODE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python index_build.py
      - name: idx 브랜치에 저장
        run: |
          [ -f out/index.json ] || { echo "이번에는 계산 안 함"; exit 0; }
          cd out
          git init -q -b idx
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.json
          git commit -q -m "지수 확률 $(date -u +%FT%H:%M)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" idx
